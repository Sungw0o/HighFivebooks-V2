apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: highfivebooks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sungw0o/HighFivebooks-V2.git
    targetRevision: main
    path: k8s/overlays/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: highfivebooks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
