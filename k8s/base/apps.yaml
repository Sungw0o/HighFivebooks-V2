apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-server
  template:
    metadata:
      labels:
        app: book-server
    spec:
      containers:
        - name: book-server
          image: ghcr.io/sungw0o/highfivebooks-v2/book-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: highfivebooks-config
            - secretRef:
                name: highfivebooks-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: book-server
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: book-server
---
