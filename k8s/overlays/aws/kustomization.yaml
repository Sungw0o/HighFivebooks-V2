apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - storageclass.yaml

patches:
  - path: delete-example-secret.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 640Mi
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
      - op: add
        path: /spec/template/metadata/labels/tier
        value: backend
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                tier: backend
  - target:
      group: apps
      version: v1
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: elasticsearch
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: -Xms384m -Xmx384m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: order-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/strategy/canary/maxSurge
        value: 0
      - op: add
        path: /spec/strategy/canary/maxUnavailable
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 640Mi
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
      - op: add
        path: /spec/template/metadata/labels/tier
        value: backend
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                tier: backend

images:
  - name: ghcr.io/sungw0o/highfivebooks-v2/order-server
    newName: 756090160762.dkr.ecr.ap-northeast-2.amazonaws.com/highfivebooks-v2/order-server
    newTag: latest
  - name: ghcr.io/sungw0o/highfivebooks-v2/book-server
    newName: 756090160762.dkr.ecr.ap-northeast-2.amazonaws.com/highfivebooks-v2/book-server
    newTag: latest
  - name: ghcr.io/sungw0o/highfivebooks-v2/member-server
    newName: 756090160762.dkr.ecr.ap-northeast-2.amazonaws.com/highfivebooks-v2/member-server
    newTag: latest
  - name: ghcr.io/sungw0o/highfivebooks-v2/coupon-server
    newName: 756090160762.dkr.ecr.ap-northeast-2.amazonaws.com/highfivebooks-v2/coupon-server
    newTag: latest
  - name: ghcr.io/sungw0o/highfivebooks-v2/payment-server
    newName: 756090160762.dkr.ecr.ap-northeast-2.amazonaws.com/highfivebooks-v2/payment-server
    newTag: latest
  - name: ghcr.io/sungw0o/highfivebooks-v2/elasticsearch-nori
    newName: 756090160762.dkr.ecr.ap-northeast-2.amazonaws.com/highfivebooks-v2/elasticsearch-nori
    newTag: 8.18.8
