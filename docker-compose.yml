name: highfivebooks-v2

# 사용법
#   인프라만:        docker compose up -d
#   전체 MSA 통합:   docker compose --profile apps up -d --build
#
# 앱 서비스는 각 서비스 Dockerfile이 target/*.jar 를 COPY 하므로,
# 빌드 전에 서비스별로 jar 를 먼저 패키징해야 한다.
#   예) cd services/order-server && ./mvnw.cmd -DskipTests package
# 환경변수는 루트 .env 를 사용한다 (cp .env.example .env).

# 앱 서비스 공통 환경변수: 컨테이너 네트워크 기준 호스트로 재정의한다.
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: "9200"
  MINIO_URL: http://minio:9000
  BOOK_SERVICE_URL: http://book-server:8080
  MEMBER_SERVICE_URL: http://member-server:8080
  COUPON_SERVICE_URL: http://coupon-server:8080
  PAYMENT_SERVICE_URL: http://payment-server:8080
  ORDER_SERVICE_URL: http://order-server:8080
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 60s

services:
  mysql:
    image: mysql:8.4
    container_name: highfive-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-highfive_root}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - highfive_mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: highfive-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-highfive}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-highfive}
      TZ: Asia/Seoul
    volumes:
      - highfive_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: highfive-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-highfive_redis}"]
    volumes:
      - highfive_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-highfive_redis} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: ghcr.io/sungw0o/highfivebooks-v2/elasticsearch-nori:8.18.8
    container_name: highfive-elasticsearch
    restart: unless-stopped
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Seoul
    volumes:
      - highfive_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: highfive-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9007}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Seoul
    command: server /data --console-address ":9001"
    volumes:
      - highfive_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: highfive-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BOOK_BUCKET_NAME: ${MINIO_BOOK_BUCKET_NAME:-book-images}
      MINIO_REVIEW_BUCKET_NAME: ${MINIO_REVIEW_BUCKET_NAME:-review-images}
    entrypoint: >
      /bin/sh -c "
      mc alias set highfive http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing highfive/$${MINIO_BOOK_BUCKET_NAME} &&
      mc mb --ignore-existing highfive/$${MINIO_REVIEW_BUCKET_NAME}
      "

  book-server:
    build:
      context: ./services/book-server
    image: highfivebooks-v2/book-server:local
    container_name: highfive-book-server
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *app-env
    ports:
      - "${BOOK_SERVER_PORT:-9002}:8080"
    healthcheck: *app-healthcheck

  member-server:
    build:
      context: ./services/member-server
    image: highfivebooks-v2/member-server:local
    container_name: highfive-member-server
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *app-env
    ports:
      - "${MEMBER_SERVER_PORT:-9001}:8080"
    healthcheck: *app-healthcheck

  coupon-server:
    build:
      context: ./services/coupon-server
    image: highfivebooks-v2/coupon-server:local
    container_name: highfive-coupon-server
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *app-env
    ports:
      - "${COUPON_SERVER_PORT:-9004}:8080"
    healthcheck: *app-healthcheck

  payment-server:
    build:
      context: ./services/payment-server
    image: highfivebooks-v2/payment-server:local
    container_name: highfive-payment-server
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *app-env
    ports:
      - "${PAYMENT_SERVER_PORT:-9005}:8080"
    healthcheck: *app-healthcheck

  order-server:
    build:
      context: ./services/order-server
    image: highfivebooks-v2/order-server:local
    container_name: highfive-order-server
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      book-server:
        condition: service_healthy
      member-server:
        condition: service_healthy
      coupon-server:
        condition: service_healthy
      payment-server:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *app-env
    ports:
      - "${ORDER_SERVER_PORT:-9006}:8080"
    healthcheck: *app-healthcheck

volumes:
  highfive_mysql_data:
  highfive_rabbitmq_data:
  highfive_redis_data:
  highfive_elasticsearch_data:
  highfive_minio_data:
