<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">HighFiveBooks V2 Architecture</title>
  <desc id="desc">Target cloud deployment and local reproducibility architecture for HighFiveBooks V2.</desc>

  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d8dee9; stroke-width: 1.5; }
      .panel-soft { fill: #f2f6ff; stroke: #c7d8ff; stroke-width: 1.5; }
      .cloud { fill: #edf7f3; stroke: #a7d9c4; stroke-width: 1.5; }
      .data { fill: #fff6e8; stroke: #efc27a; stroke-width: 1.5; }
      .msg { fill: #f9eefc; stroke: #d7a6e5; stroke-width: 1.5; }
      .svc { fill: #ffffff; stroke: #4f6bed; stroke-width: 1.5; }
      .store { fill: #fefefe; stroke: #2f9e8f; stroke-width: 1.5; }
      .local { fill: #f4f5f7; stroke: #c6ccd6; stroke-width: 1.5; }
      .title { font: 700 30px Arial, sans-serif; fill: #19202a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #5f6b7a; }
      .h2 { font: 700 18px Arial, sans-serif; fill: #202938; }
      .h3 { font: 700 15px Arial, sans-serif; fill: #202938; }
      .label { font: 500 13px Arial, sans-serif; fill: #293241; }
      .muted { font: 400 12px Arial, sans-serif; fill: #697386; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #697386; }
      .arrow { stroke: #3d4756; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #7b8798; stroke-width: 1.5; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 6 5; }
      .divider { stroke: #d8dee9; stroke-width: 1; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4756"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8798"/>
    </marker>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#19202a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" width="1440" height="920"/>

  <text x="64" y="58" class="title">HighFiveBooks V2 Architecture</text>
  <text x="64" y="84" class="subtitle">MSA remains independent. Cloud routing, Kubernetes service discovery, and local reproducibility are separated by responsibility.</text>

  <rect x="52" y="120" width="1336" height="548" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="80" y="156" class="h2">Target Cloud Deployment</text>
  <text x="80" y="178" class="subtitle">Cloudflare routes static traffic to S3 and API traffic to EC2 nginx Ingress, then Kubernetes services.</text>

  <rect x="82" y="220" width="178" height="96" rx="12" class="panel-soft"/>
  <text x="122" y="252" class="h3">User</text>
  <text x="112" y="276" class="muted">Browser</text>
  <text x="105" y="294" class="tiny">HTTPS traffic</text>

  <rect x="306" y="206" width="210" height="124" rx="14" class="cloud"/>
  <text x="354" y="238" class="h3">Cloudflare</text>
  <text x="336" y="263" class="muted">DNS / CDN / TLS</text>
  <text x="337" y="283" class="muted">WAF / DDoS guard</text>
  <line x1="326" y1="300" x2="496" y2="300" class="divider"/>
  <text x="337" y="318" class="tiny">/* and /api/* split</text>

  <rect x="578" y="156" width="214" height="104" rx="14" class="store"/>
  <text x="639" y="190" class="h3">S3</text>
  <text x="618" y="215" class="muted">React static build</text>
  <text x="603" y="235" class="tiny">apps/storefront dist</text>

  <rect x="578" y="304" width="214" height="104" rx="14" class="panel-soft"/>
  <text x="623" y="338" class="h3">EC2 Public</text>
  <text x="606" y="363" class="muted">nginx Ingress entry</text>
  <text x="627" y="383" class="tiny">/api/* traffic</text>

  <rect x="850" y="150" width="468" height="440" rx="16" class="panel-soft"/>
  <text x="880" y="184" class="h2">Kubernetes Namespace: highfivebooks</text>
  <text x="880" y="206" class="subtitle">Service DNS replaces Eureka. ConfigMap/Secret replaces Config Server. Ingress replaces Gateway.</text>

  <rect x="882" y="236" width="404" height="66" rx="12" class="panel"/>
  <text x="1012" y="264" class="h3">Ingress</text>
  <text x="957" y="284" class="muted">highfivebooks.local / API routes</text>

  <rect x="882" y="336" width="116" height="74" rx="12" class="svc"/>
  <text x="910" y="366" class="label">order</text>
  <text x="903" y="386" class="tiny">replicas=2</text>

  <rect x="1026" y="336" width="116" height="74" rx="12" class="svc"/>
  <text x="1055" y="366" class="label">book</text>
  <text x="1049" y="386" class="tiny">search/stock</text>

  <rect x="1170" y="336" width="116" height="74" rx="12" class="svc"/>
  <text x="1190" y="366" class="label">member</text>
  <text x="1190" y="386" class="tiny">point/cart</text>

  <rect x="954" y="440" width="116" height="74" rx="12" class="svc"/>
  <text x="982" y="470" class="label">coupon</text>
  <text x="973" y="490" class="tiny">issue/use</text>

  <rect x="1098" y="440" width="116" height="74" rx="12" class="svc"/>
  <text x="1120" y="470" class="label">payment</text>
  <text x="1124" y="490" class="tiny">Toss/outbox</text>

  <rect x="882" y="544" width="404" height="34" rx="10" class="panel"/>
  <text x="971" y="566" class="tiny">readiness / liveness / service DNS smoke checks</text>

  <rect x="858" y="618" width="190" height="76" rx="14" class="data"/>
  <text x="916" y="648" class="h3">RDS MySQL</text>
  <text x="895" y="672" class="tiny">service databases / book dump source</text>

  <rect x="1086" y="618" width="190" height="76" rx="14" class="msg"/>
  <text x="1138" y="648" class="h3">RabbitMQ</text>
  <text x="1128" y="672" class="tiny">payment success / retry / DLQ</text>

  <rect x="80" y="454" width="250" height="120" rx="14" class="data"/>
  <text x="136" y="488" class="h3">AWS Data Bootstrap</text>
  <text x="110" y="514" class="muted">EC2 + RDS used briefly</text>
  <text x="112" y="536" class="tiny">Aladin API -&gt; RDS -&gt; dump</text>
  <text x="112" y="554" class="tiny">157,118 books imported locally</text>

  <rect x="380" y="454" width="300" height="120" rx="14" class="panel"/>
  <text x="452" y="488" class="h3">CI/CD Target</text>
  <text x="424" y="514" class="muted">GitHub Actions -&gt; GHCR</text>
  <text x="414" y="536" class="tiny">build / test / container image push</text>
  <text x="414" y="554" class="tiny">K8s manifests consume image tags</text>

  <path d="M260 268 H306" class="arrow"/>
  <path d="M516 236 H578" class="arrow"/>
  <text x="535" y="224" class="tiny">/*</text>
  <path d="M516 300 C540 300 540 356 578 356" class="arrow"/>
  <text x="532" y="334" class="tiny">/api/*</text>
  <path d="M792 356 H850" class="arrow"/>
  <path d="M1084 302 V336" class="arrow"/>
  <path d="M998 373 H1026" class="arrow-soft"/>
  <path d="M998 373 C1024 420 1024 440 1012 440" class="arrow-soft"/>
  <path d="M998 373 C1060 420 1110 420 1156 440" class="arrow-soft"/>
  <path d="M998 373 H1170" class="arrow-soft"/>
  <path d="M1048 618 C1012 596 976 596 953 590" class="arrow"/>
  <path d="M1086 656 C1030 620 940 618 940 410" class="arrow-soft"/>
  <path d="M330 514 H380" class="arrow-soft"/>
  <path d="M680 514 C754 514 782 572 858 656" class="arrow-soft"/>

  <rect x="52" y="708" width="1336" height="160" rx="18" class="local" filter="url(#shadow)"/>
  <text x="80" y="746" class="h2">Local Reproducibility Harness</text>
  <text x="80" y="768" class="subtitle">A second machine can reproduce the stack with .env.example, PowerShell scripts, Docker Compose, and the optional book dump.</text>

  <rect x="96" y="800" width="172" height="44" rx="10" class="panel"/>
  <text x="128" y="827" class="label">.env.example</text>

  <rect x="318" y="800" width="190" height="44" rx="10" class="panel"/>
  <text x="347" y="827" class="label">local-up.ps1</text>

  <rect x="558" y="800" width="236" height="44" rx="10" class="panel"/>
  <text x="591" y="827" class="label">Docker Compose MSA</text>

  <rect x="844" y="800" width="208" height="44" rx="10" class="panel"/>
  <text x="875" y="827" class="label">import-book-dump.ps1</text>

  <rect x="1102" y="800" width="220" height="44" rx="10" class="panel"/>
  <text x="1135" y="827" class="label">k6 performance tests</text>

  <path d="M268 822 H318" class="arrow"/>
  <path d="M508 822 H558" class="arrow"/>
  <path d="M794 822 H844" class="arrow"/>
  <path d="M1052 822 H1102" class="arrow"/>

  <text x="80" y="892" class="tiny">Generated for HighFiveBooks V2 portfolio documentation. Secrets and dumps are excluded from Git; external keys and large data dumps are provided separately.</text>
</svg>
