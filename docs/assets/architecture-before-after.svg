  </g>
  <g font-size="11.5" font-weight="600">
    <rect x="715" y="692" width="230" height="34" rx="7" fill="#E7F6EE" stroke="#2E8B57"/><text x="830" y="714" text-anchor="middle" fill="#1F2328">Feign NEVER_RETRY + CircuitBreaker</text>
    <rect x="955" y="692" width="230" height="34" rx="7" fill="#E7F6EE" stroke="#2E8B57"/><text x="1070" y="714" text-anchor="middle" fill="#1F2328">트랜잭션 경계 분리 + 보상(TCC)</text>
  </g>
  <rect x="715" y="736" width="470" height="34" rx="7" fill="#E7F6EE" stroke="#2E8B57"/>
  <text x="950" y="758" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2328">RabbitMQ payment-success · Retry backoff · DLQ 격리</text>
