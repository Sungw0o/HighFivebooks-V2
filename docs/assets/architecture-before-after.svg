  <text x="253" y="685" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2328">Client</text>
  <text x="253" y="704" text-anchor="middle" font-size="11.5" fill="#656D76">브라우저</text>

  <rect x="325" y="590" width="130" height="58" rx="10" fill="#E7F6EE" stroke="#2E8B57"/>
  <text x="390" y="614" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">React storefront</text>
  <text x="390" y="632" text-anchor="middle" font-size="11" fill="#2E8B57">구 Thymeleaf</text>
  <rect x="325" y="662" width="130" height="58" rx="10" fill="#EAF1FF" stroke="#326CE5"/>
  <text x="390" y="686" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">Ingress</text>
  <text x="390" y="704" text-anchor="middle" font-size="11" fill="#326CE5">구 Gateway</text>

  <rect x="485" y="590" width="175" height="58" rx="10" fill="#EAF1FF" stroke="#326CE5"/>
  <text x="572" y="614" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">ConfigMap / Secret</text>
  <text x="572" y="632" text-anchor="middle" font-size="11" fill="#326CE5">구 Config Server</text>
  <rect x="485" y="662" width="175" height="58" rx="10" fill="#EAF1FF" stroke="#326CE5"/>
  <text x="572" y="686" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">Service DNS</text>
  <text x="572" y="704" text-anchor="middle" font-size="11" fill="#326CE5">구 Eureka</text>

