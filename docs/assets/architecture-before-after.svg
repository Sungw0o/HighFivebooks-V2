  <rect x="30" y="500" width="150" height="380" rx="18" fill="#EAF1FF"/>
  <text x="105" y="690" text-anchor="middle" font-size="19" font-weight="700" fill="#1B49B6" transform="rotate(-90 105 690)">TO-BE · V2</text>

