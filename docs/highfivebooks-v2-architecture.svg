<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">HighFiveBooks V2 Kubernetes-native MSA Architecture</title>
  <desc id="desc">HighFiveBooks V2 deployment architecture showing React storefront, Kubernetes Ingress, domain services, RabbitMQ DLQ, Redis ShedLock, MySQL, ConfigMap, Secret, and Spring Cloud replacements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="cluster" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .page { fill: url(#bg); }
      .title { font: 800 34px "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 15px "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .section { font: 800 18px "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .label { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .small { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .tiny { font: 600 11px "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .boxNoShadow { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .cluster { fill: url(#cluster); stroke: #93c5fd; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .edge { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .mainFlow { stroke: #2563eb; stroke-width: 3.2; fill: none; marker-end: url(#arrowBlue); }
      .async { stroke: #b45309; stroke-width: 2.8; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowAmber); }
      .config { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 4 5; marker-end: url(#arrow); }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 999; }
      .badgeText { font: 700 11px "Segoe UI", Arial, sans-serif; fill: #1d4ed8; letter-spacing: 0; }
      .green { fill: #ecfdf5; stroke: #86efac; }
      .greenText { fill: #047857; }
      .amber { fill: #fffbeb; stroke: #fcd34d; }
      .amberText { fill: #92400e; }
      .red { fill: #fef2f2; stroke: #fecaca; }
      .redText { fill: #b91c1c; }
    </style>
  </defs>

  <rect class="page" width="1440" height="980"/>

  <text x="72" y="62" class="title">HighFiveBooks V2 Kubernetes-native MSA Architecture</text>
  <text x="74" y="92" class="subtitle">Spring Cloud 운영 요소를 Kubernetes Service DNS, ConfigMap/Secret, Ingress로 대체한 주문 중심 MSA 구조</text>

  <rect x="72" y="126" width="1296" height="760" class="cluster"/>
  <text x="96" y="162" class="section">Kubernetes Cluster</text>
  <rect x="1180" y="138" width="150" height="26" class="badge"/>
  <text x="1198" y="156" class="badgeText">namespace: highfivebooks</text>

  <rect x="84" y="908" width="360" height="38" class="boxNoShadow"/>
  <line x1="104" y1="927" x2="154" y2="927" class="mainFlow"/>
  <text x="168" y="932" class="small">주요 사용자 요청</text>
  <line x1="306" y1="927" x2="356" y2="927" class="async"/>
  <text x="370" y="932" class="small">비동기 메시지</text>

  <rect x="98" y="198" width="190" height="82" class="box"/>
  <text x="128" y="232" class="label">User Browser</text>
  <text x="128" y="256" class="small">사용자 쇼핑몰 접근</text>

  <rect x="352" y="198" width="218" height="82" class="box"/>
  <text x="388" y="232" class="label">React Storefront</text>
  <text x="388" y="256" class="small">apps/storefront</text>

  <rect x="656" y="198" width="210" height="82" class="box"/>
  <text x="715" y="232" class="label">Ingress</text>
  <text x="694" y="256" class="small">Gateway 역할 대체</text>

  <path d="M 288 239 L 352 239" class="mainFlow"/>
  <path d="M 570 239 L 656 239" class="mainFlow"/>

  <rect x="626" y="336" width="270" height="142" class="box"/>
  <text x="674" y="372" class="label">order-server</text>
  <text x="662" y="397" class="small">주문 생성 / 결제 후처리</text>
  <text x="662" y="418" class="small">취소 / 보상 트랜잭션</text>
  <rect x="650" y="438" width="86" height="24" class="badge green"/>
  <text x="666" y="455" class="badgeText greenText">replicas: 2</text>
  <rect x="746" y="438" width="126" height="24" class="badge"/>
  <text x="760" y="455" class="badgeText">health probes</text>
  <path d="M 761 280 L 761 336" class="mainFlow"/>

  <rect x="170" y="550" width="190" height="108" class="box"/>
  <text x="214" y="587" class="label">book-server</text>
  <text x="204" y="613" class="small">책 정보 / 재고</text>
  <text x="204" y="635" class="small">선점 / 확정 / 복구</text>

  <rect x="424" y="550" width="190" height="108" class="box"/>
  <text x="454" y="587" class="label">member-server</text>
  <text x="458" y="613" class="small">회원 등급 / 포인트</text>
  <text x="458" y="635" class="small">예약 / 확정 / 취소</text>

  <rect x="678" y="550" width="190" height="108" class="box"/>
  <text x="710" y="587" class="label">coupon-server</text>
  <text x="714" y="613" class="small">쿠폰 계산</text>
  <text x="714" y="635" class="small">사용 / 취소</text>

  <rect x="932" y="550" width="190" height="108" class="box"/>
  <text x="960" y="587" class="label">payment-server</text>
  <text x="968" y="613" class="small">결제 확인</text>
  <text x="968" y="635" class="small">성공 이벤트 발행</text>

  <path d="M 626 430 C 505 446 382 494 300 550" class="edge"/>
  <path d="M 696 478 C 635 502 574 526 536 550" class="edge"/>
  <path d="M 776 478 C 776 504 776 526 776 550" class="edge"/>
  <path d="M 896 430 C 950 454 1000 504 1020 550" class="edge"/>

  <rect x="1050" y="324" width="210" height="86" class="box"/>
  <text x="1115" y="358" class="label">RabbitMQ</text>
  <text x="1090" y="383" class="small">payment-success event</text>

  <rect x="1074" y="440" width="164" height="68" class="boxNoShadow red"/>
  <text x="1116" y="468" class="label redText">DLQ</text>
  <text x="1096" y="490" class="small">poison message 격리</text>

  <path d="M 1027 550 C 1068 506 1120 472 1156 410" class="async"/>
  <path d="M 1156 410 L 1156 440" class="async"/>
  <path d="M 1050 366 C 988 360 934 360 896 374" class="async"/>

  <rect x="118" y="730" width="242" height="82" class="box"/>
  <text x="204" y="764" class="label">MySQL</text>
  <text x="168" y="789" class="small">service databases</text>

  <rect x="424" y="730" width="190" height="82" class="box"/>
  <text x="493" y="764" class="label">Redis</text>
  <text x="464" y="789" class="small">ShedLock / cache</text>

  <rect x="678" y="730" width="190" height="82" class="box"/>
  <text x="716" y="764" class="label">ConfigMap</text>
  <text x="716" y="789" class="small">application settings</text>

  <rect x="932" y="730" width="190" height="82" class="box"/>
  <text x="986" y="764" class="label">Secret</text>
  <text x="972" y="789" class="small">password / token</text>

  <path d="M 265 658 L 239 730" class="edge"/>
  <path d="M 519 658 L 519 730" class="edge"/>
  <path d="M 773 658 L 773 730" class="edge"/>
  <path d="M 1027 658 L 1027 730" class="edge"/>
  <path d="M 519 730 C 522 652 580 510 626 444" class="config"/>
  <path d="M 773 730 L 773 658" class="config"/>
  <path d="M 1027 730 L 1027 658" class="config"/>

  <rect x="1010" y="190" width="276" height="102" class="boxNoShadow amber"/>
  <text x="1036" y="224" class="label amberText">Spring Cloud 대체</text>
  <text x="1038" y="250" class="small">Eureka → Service DNS</text>
  <text x="1038" y="271" class="small">Config Server → ConfigMap / Secret</text>

  <rect x="1010" y="820" width="276" height="44" class="boxNoShadow amber"/>
  <text x="1038" y="848" class="small">Gateway → Kubernetes Ingress</text>

  <rect x="96" y="338" width="300" height="124" class="boxNoShadow"/>
  <text x="122" y="372" class="section">Order Flow</text>
  <text x="124" y="401" class="small">1. 주문 생성 요청</text>
  <text x="124" y="423" class="small">2. 재고 / 포인트 / 쿠폰 검증</text>
  <text x="124" y="445" class="small">3. 결제 성공 후 상태 변경</text>

  <rect x="96" y="488" width="300" height="34" class="badge"/>
  <text x="122" y="510" class="badgeText">HTTP / Feign: 동기 도메인 호출</text>

  <rect x="1038" y="680" width="292" height="34" class="badge amber"/>
  <text x="1062" y="702" class="badgeText amberText">RabbitMQ: 제한 재시도 후 DLQ 격리</text>
</svg>
